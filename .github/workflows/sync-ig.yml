name: Sync Instagram Posts

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 時間 0 點執行一次
  workflow_dispatch:     # 允許在 GitHub 網頁上手動點擊執行

# 賦予機器人寫入程式碼的權限
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run sync script
        env:
          # 從 Secrets 讀取金鑰
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python sync_ig.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync new Instagram travel posts" && git push)
